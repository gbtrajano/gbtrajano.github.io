name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas necessárias para publicar no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que só um deploy rode por vez.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (Bun + Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Build (static export)
        run: bun run build

      # O Next gera a pasta out/. Este arquivo desliga o processamento
      # Jekyll do Pages (que ignoraria pastas começando com "_").
      - name: Desabilitar Jekyll
        run: touch out/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
